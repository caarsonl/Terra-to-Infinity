<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Terra to Infinity — 3D Cosmic Incremental</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-container">
    <!-- Left Panel: 3D Interactive Canvas & Telemetry -->
    <section class="left-panel" id="leftPanel">
      <canvas id="cosmosCanvas"></canvas>

      <div class="hud-top">
        <div class="title-block">
          <h1>Terra to Infinity</h1>
          <div class="era-badge" id="eraBadge">🌍 Era I: Planet Earth</div>
        </div>
        <div class="controls-bar">
          <button class="icon-btn" id="muteBtn" title="Toggle Procedural Audio">🔊 Sound On</button>
          <button class="icon-btn" id="saveBtn" title="Save Progress">💾 Save</button>
          <button class="icon-btn danger" id="resetBtn" title="Wipe Save Data">♻️ Hard Reset</button>
        </div>
      </div>

      <div class="telemetry-center">
        <div class="matter-label">Accumulated Matter</div>
        <div class="matter-readout" id="matterDisplay">0</div>
        <div class="rates-row">
          <div class="rate-pill">⚡ <span id="mpsDisplay">0.00</span> / sec</div>
          <div class="rate-pill click">👆 <span id="mpcDisplay">1.00</span> / click</div>
          <div class="rate-pill dark" id="darkEnergyPill" style="display: none;">🌌 <span id="deBonusDisplay">+0%</span> Dark Energy</div>
        </div>
      </div>

      <div class="hud-bottom">
        <div class="hud-left-meta">
          <div class="structures-bar" id="structuresBar">No 3D megastructures built yet</div>
          <div class="controls-hint">🖱️ Click to harvest • Drag to orbit 3D • Scroll to zoom</div>
        </div>
        <span id="totalEarnedDisplay">Run Matter: 0</span>
      </div>
    </section>

    <!-- Right Panel: Upgrades, Cosmic Eras & Big Crunch -->
    <aside class="right-panel">
      <nav class="nav-tabs">
        <button class="tab-btn active" data-tab="generators">⚙️ Generators</button>
        <button class="tab-btn" data-tab="eras">🌠 Cosmic Eras</button>
        <button class="tab-btn" data-tab="prestige">🕳️ Big Crunch</button>
      </nav>
      <div class="scroll-area" id="tabContent"></div>
    </aside>
  </div>

  <div class="toast" id="toast">Game Saved</div>

  <script src="script.js"></script>
</body>
</html>
